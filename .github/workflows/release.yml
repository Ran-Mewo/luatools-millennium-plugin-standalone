name: Release luatools.star

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          mkdir -p dist
          npx starlight pack --release --of dist

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push origin latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/luatools.star --clobber
            gh release edit latest --title "Latest commit build" --notes "Automatic build from ${GITHUB_SHA}." --latest
          else
            gh release create latest dist/luatools.star --title "Latest commit build" --notes "Automatic build from ${GITHUB_SHA}." --latest
          fi
